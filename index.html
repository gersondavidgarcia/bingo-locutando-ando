<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bingo Tradicional - Menú</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d3c9b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Bingo">
    
    <link rel="apple-touch-icon" href="icono-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icono-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icono-512.png">
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="body-center" ontouchstart="">

    <div class="menu-container">
        <h1 class="app-title">🎱 BINGO TRADICIONAL</h1>
        
        <div class="menu-card">
            <button class="btn-principal" onclick="iniciarJuegoDirecto()" onfocus="this.blur()">▶ JUGAR AHORA</button>
            <button class="btn-secundario" onclick="abrirConfiguracion()" onfocus="this.blur()">⚙️ CONFIGURACIÓN</button>
        </div>
    </div>

    <!-- MODAL DE CONFIGURACIÓN -->
    <div class="modal-overlay" id="modalConfig">
        <div class="modal-box">
            <div class="modal-header">
                <h2>⚙️ Configuración</h2>
                <button class="modal-close" onclick="cerrarConfiguracion()" onfocus="this.blur()">✕</button>
            </div>

            <div class="modal-body">
                <div class="form-group">
                    <label for="cantCartones">Cantidad de Cartones:</label>
                    <select id="cantCartones">
                        <option value="6">6 Cartones</option>
                        <option value="9">9 Cartones</option>
                        <option value="12">12 Cartones</option>
                        <option value="15" selected>15 Cartones</option>
                        <option value="18">18 Cartones</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="usarBaseDatos">Usar base de datos (nombres reales):</label>
                    <select id="usarBaseDatos">
                        <option value="si" selected>SÍ - Cargar nombres de Firebase</option>
                        <option value="no">NO - Mostrar "CARTÓN N"</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="formatoControl">Formato del control (1-75):</label>
                    <select id="formatoControl">
                        <option value="15x5" selected>Horizontal (15 × 5) - Clásico</option>
                        <option value="10x8">Compacto (10 × 8)</option>
                        <option value="8x10">Vertical compacto (8 × 10)</option>
                        <option value="9x9">Cuadrado (9 × 9)</option>
                        <option value="7x11">Vertical alto (7 × 11)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="cantidadFiguras">Mini-cartones de referencia:</label>
                    <select id="cantidadFiguras">
                        <option value="0">0 - Ocultar</option>
                        <option value="1">1 - Solo figura</option>
                        <option value="2" selected>2 - Lleno + Figura</option>
                        <option value="3">3 - Lleno + Figura + Extra</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="tamanoControl">
                        Ancho del panel de control: 
                        <span id="valTamanoControl">58%</span>
                    </label>
                    <input type="range" id="tamanoControl" min="20" max="70" value="58" step="2">
                </div>

                <div class="form-group">
                    <label for="tamanoFiguras">
                        Tamaño de mini-cartones: 
                        <span id="valTamanoFiguras">42px</span>
                    </label>
                    <input type="range" id="tamanoFiguras" min="25" max="80" value="42" step="1">
                </div>
            </div>

            <div class="modal-footer">
                <button class="btn-modal-cancelar" onclick="cerrarConfiguracion()" onfocus="this.blur()">Cancelar</button>
                <button class="btn-modal-guardar" onclick="guardarConfiguracion()" onfocus="this.blur()">Guardar</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .then((reg) => console.log('✅ SW registrado:', reg.scope))
                    .catch((err) => console.warn('❌ SW error:', err));
            });
        }
    </script>
</body>
</html>
