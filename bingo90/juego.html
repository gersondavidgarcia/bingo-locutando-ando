<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bingo Tradicional · Premio Único Global</title>
    
    <!-- ========================================================== -->
    <!-- 🟢 CONFIGURACIÓN PARA QUE FUNCIONE COMO APP 🟢 -->
    <!-- ========================================================== -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <!-- ESTA LÍNEA ES LA QUE FUERZA A OCULTAR LA BARRA DE ANDROID -->
    <meta name="x5-full-screen" content="true">
    <meta name="full-screen" content="yes">
    <!-- ========================================================== -->
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Inicio de la app -->
    <div class="bingo-app">
        
        <div class="banner-premio" id="bannerPremio"></div>

        <div class="cartones-grid" id="cartonesGrid"></div>

        <div class="bolillero-container">
            
            <!-- CONTENEDOR ORIGINAL: LA BOLA, EL BOTÓN Y EL CONTADOR -->
            <div class="bolillero-top-row" style="display: flex; align-items: flex-start; justify-content: space-between; width: 100%;">
                
                <!-- 1. La esfera -->
                <div class="bolillero-stage">
                    <div class="bolillero-sphere" id="bolilleroSphere">
                        <span class="bolillero-numero" id="numeroDisplay">--</span>
                    </div>
                </div>
                
               <!-- 2. El botón SACAR BOLA CON BOLA ENCIMA -->
<div style="position: relative; display: inline-block; margin-top: 8px;">
    
    <!-- BOLA DECORATIVA ENCIMA -->
    <div class="bola-encima" id="bolaEncima">
        <span id="numeroBolaEncima">8</span>
    </div>
    
    <!-- BOTÓN ORIGINAL -->
  <button class="btn-sacar-bola" id="btnSacarBola" style="
    height: 64px;
    padding: 0 18px;
    width: auto;
    min-width: 100px;
    background: var(--tema-color, #2e7d32);
    border: 3px solid #ffffff;
    color: white;
    font-weight: 800;
    font-size: 0.8rem;
    border-radius: 14px;
    cursor: pointer;
    box-shadow: 0 2px 5px rgba(0,0,0,0.12);
    transition: background 0.2s, transform 0.1s;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: 1.2;
    letter-spacing: 1px;
    text-align: center;
" 
onmousedown="this.style.background='#1b5e20'; this.style.transform='scale(0.95)'" 
onmouseup="this.style.background='var(--tema-color, #2e7d32)'; this.style.transform='scale(1)'" 
ontouchstart="this.style.background='#1b5e20'; this.style.transform='scale(0.95)'" 
ontouchend="this.style.background='var(--tema-color, #2e7d32)'; this.style.transform='scale(1)'">
    <span style="font-size: 1.1rem; opacity: 0; pointer-events: none;">🎱</span>
    SACAR<br>BOLA
</button>
    
</div>

                <!-- 3. El contador de Bolas -->
                <div class="stats-box" style="
                    display: flex;
                    flex-direction: row;
                    align-items: center;
                    justify-content: center;
                    gap: 6px;
                    font-size: 0.75rem;
                    font-weight: 700;
                    color: #555;
                    background: #fff;
                    padding: 6px 12px;
                    border-radius: 5px;
                    border: 1px solid #ddd;
                ">
                    BOLAS
                    <span id="statsDisplay" style="
                        font-size: 0.9rem;
                        font-weight: 900;
                        color: var(--tema-color, #2e7d32);
                    ">0/90</span>
                </div>

            </div>

            <div class="recientes-container">
                <div class="recientes-lista" id="recientesLista"></div>
            </div>
        </div>

        <!-- 🟢 CONTENEDOR FLEXIBLE: TABLA A LA IZQ, BOTONES A LA DERECHA 🟢 -->
        <div style="display: flex; width: 100%; gap: 10px; margin-bottom: 5px;">
            
            <!-- 1. TABLA DE NÚMEROS -->
            <div class="panel-numeros-inferior" style="flex: 0 0 58%;">
                <div class="titulo-tabla">CONTROL (1 - 90)</div>
                <div class="tabla-numeros" id="tablaNumeros"></div>
            </div>

            <!-- 2. CONTENEDOR DEL ESPACIO VACÍO -->
            <div style="flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px;">
                
                <!-- 🟢 BOTÓN CAMBIAR (RECARGA LA PÁGINA) 🟢 -->
                <button onclick="location.reload()" style="
                    width: 100%;
                    padding: 10px 0;
                    background: #3a3a4a;
                    color: #e0e0e0;
                    border: none;
                    border-radius: 25px;
                    font-size: 0.85rem;
                    font-weight: 700;
                    cursor: pointer;
                    transition: background 0.2s, transform 0.1s;
                    letter-spacing: 0.5px;
                    text-align: center;
                " onmousedown="this.style.transform='scale(0.96)'" onmouseup="this.style.transform='scale(1)'" ontouchstart="this.style.transform='scale(0.96)'" ontouchend="this.style.transform='scale(1)'">
                🔄 CAMBIAR
                </button>

                <!-- 3. BOTÓN DE ATRÁS -->
                <button onclick="window.location.href='index.html'" style="
                    width: 100%;
                    padding: 10px 0;
                    background: #2d2d3d;
                    color: #e0e0e0;
                    border: none;
                    border-radius: 25px;
                    font-size: 0.9rem;
                    font-weight: 700;
                    cursor: pointer;
                    transition: background 0.2s, transform 0.1s;
                    letter-spacing: 1px;
                    text-align: center;
                " onmousedown="this.style.transform='scale(0.96)'" onmouseup="this.style.transform='scale(1)'" ontouchstart="this.style.transform='scale(0.96)'" ontouchend="this.style.transform='scale(1)'">
                ⬅ ATRÁS
                </button>
                
            </div>
            
        </div>

    </div> <!-- Fin del div bingo-app -->

    <script src="script.js"></script>
</body>
</html>
