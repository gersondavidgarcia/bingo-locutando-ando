<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bingo Tradicional - Menú</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d3c9b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Bingo">
    
    <link rel="apple-touch-icon" href="icono-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icono-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icono-512.png">
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="body-center">

    <div class="menu-container">
        <h1 class="app-title">🎱 BINGO TRADICIONAL</h1>
        
        <div class="menu-card">
            <button class="btn-principal" onclick="iniciarJuegoDirecto()">▶ JUGAR AHORA</button>
            <button class="btn-secundario" onclick="abrirConfiguracion()">⚙️ CONFIGURACIÓN</button>
        </div>
    </div>

    <!-- MODAL DE CONFIGURACIÓN -->
    <div class="modal-overlay" id="modalConfig">
        <div class="modal-box">
            <div class="modal-header">
                <h2>⚙️ Configuración</h2>
                <button class="modal-close" onclick="cerrarConfiguracion()">✕</button>
            </div>

            <div class="modal-body">
                <div class="form-group">
                    <label for="cantCartones">Cantidad de Cartones:</label>
                    <select id="cantCartones">
                        <option value="6">6 Cartones</option>
                        <option value="9">9 Cartones</option>
                        <option value="12">12 Cartones</option>
                        <option value="15" selected>15 Cartones</option>
                        <option value="18">18 Cartones</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="maxBolas">Modo de Juego:</label>
                    <select id="maxBolas">
                        <option value="75" selected>Bingo 75 Balotas (5x5)</option>
                        <option value="90">Bingo 90 Balotas (3x9)</option>
                        <option value="100">Bingo 100 Balotas (3x5)</option>
                    </select>
                </div>
            </div>

            <div class="modal-footer">
                <button class="btn-modal-cancelar" onclick="cerrarConfiguracion()">Cancelar</button>
                <button class="btn-modal-guardar" onclick="guardarConfiguracion()">Guardar</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Registrar Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .then((reg) => console.log('✅ SW registrado:', reg.scope))
                    .catch((err) => console.warn('❌ SW error:', err));
            });
        }
    </script>
</body>
</html>
