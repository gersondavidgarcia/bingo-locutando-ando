<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bingo Tradicional 75 - 15 Cartones</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="x5-full-screen" content="true">
    <meta name="full-screen" content="yes">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="bingo-app">
        
        <div class="banner-premio" id="bannerPremio"></div>

        <!-- Modo 15 para la retícula de 3 columnas -->
        <div class="cartones-grid modo-15" id="cartonesGrid"></div>

        <div class="bolillero-container">
            
            <div class="bolillero-top-row">
                
                <div class="bolillero-stage">
                    <div class="bolillero-sphere" id="bolilleroSphere">
                        <span class="bolillero-numero" id="numeroDisplay">--</span>
                    </div>
                </div>
                
                <button class="btn-sacar-bola" id="btnSacarBola" onclick="sacarBola(event)" onfocus="this.blur()">
                    <span class="onda"></span>
                    <span class="particula"></span><span class="particula"></span>
                    <span class="particula"></span><span class="particula"></span>
                    <span class="particula"></span><span class="particula"></span>
                    <span class="particula"></span><span class="particula"></span>
                    <span class="particula"></span><span class="particula"></span>
                    <span class="particula"></span><span class="particula"></span>
                    <span class="text-glow">SACAR<br>BOLAS</span>
                </button>

                <div class="stats-box">
                    BOLAS
                    <span id="statsDisplay">0/75</span>
                </div>

            </div>

            <div class="recientes-container">
                <div class="recientes-lista" id="recientesLista"></div>
            </div>
        </div>

        <div class="panel-inferior">
            
            <div class="panel-numeros-inferior">
                <div class="titulo-tabla">CONTROL (1 - 75)</div>
                <div class="tabla-numeros" id="tablaNumeros"></div>
            </div>

            <div class="panel-botones">
                
                <button onclick="reiniciarJuego()" class="btn-cambiar" onfocus="this.blur()">
                🔄 CAMBIAR
                </button>

                <button onclick="window.location.href='index.html'" class="btn-atras" onfocus="this.blur()">
                ⬅ ATRÁS
                </button>
                
            </div>
            
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
