        function cancelarFade() {
            if (fadeIntervalId) {
                clearInterval(fadeIntervalId);
                fadeIntervalId = null;
            }
        }

        function hacerFadeInMusica(duracionMs) {
            if (!audioMusica) return;
            cancelarFade();
            const volumenObjetivo = obtenerVolumenSonido('sonidoMusicaVolumen', 0.35);
            if (volumenObjetivo <= 0) { audioMusica.volume = 0; return; }

            const pasos = 40;
            const intervaloMs = Math.max(20, Math.floor(duracionMs / pasos));
            const incremento = volumenObjetivo / pasos;
            let actual = 0;
            audioMusica.volume = 0;

            fadeIntervalId = setInterval(() => {
                actual += incremento;
                if (actual >= volumenObjetivo) {
                    audioMusica.volume = volumenObjetivo;
                    cancelarFade();
                    return;
                }
                audioMusica.volume = actual;
            }, intervaloMs);
        }

        function hacerFadeOutMusica(duracionMs, callback) {
            if (!audioMusica) { if (callback) callback(); return; }
            cancelarFade();

            const volumenInicial = audioMusica.volume;
            if (volumenInicial <= 0) { if (callback) callback(); return; }

            const pasos = 40;
            const intervaloMs = Math.max(20, Math.floor(duracionMs / pasos));
            const decremento = volumenInicial / pasos;
            let actual = volumenInicial;

            fadeIntervalId = setInterval(() => {
                actual -= decremento;
                if (actual <= 0) {
                    audioMusica.volume = 0;
                    cancelarFade();
                    if (callback) callback();
                    return;
                }
                audioMusica.volume = actual;
            }, intervaloMs);
        }

function ejecutarSonidoCampana(ctx, tipo, vol) {
    if (!ctx || vol <= 0) return;
    const now = ctx.currentTime;

    const tocarNota = (freq, startOffset, dur, waveType, peakGain, endFreq) => {
        const t0 = now + startOffset;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = waveType || 'sine';
        osc.frequency.setValueAtTime(freq, t0);
        if (endFreq) {
            osc.frequency.exponentialRampToValueAtTime(endFreq, t0 + dur);
        }
        gain.gain.setValueAtTime(0.0001, t0);
        gain.gain.linearRampToValueAtTime(Math.max(0.001, vol * peakGain), t0 + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t0);
        osc.stop(t0 + dur + 0.02);
    };

    switch (tipo) {
        case 'campana_1': // 1. Campana Clásica de Recepción
            tocarNota(1567.98, 0, 0.85, 'sine', 0.65);
            tocarNota(3135.96, 0, 0.35, 'sine', 0.25);
            tocarNota(4186.01, 0, 0.15, 'triangle', 0.18);
            break;

        case 'campana_2': // 2. Doble Timbre de Hotel (Ding-Dong)
            tocarNota(783.99, 0,    0.55, 'sine', 0.65);
            tocarNota(1567.98, 0,   0.25, 'sine', 0.20);
            tocarNota(659.25, 0.24, 0.75, 'sine', 0.65);
            tocarNota(1318.51, 0.24, 0.35, 'sine', 0.20);
            break;

        case 'campana_3': // 3. Moneda de Casino (Ching!)
            tocarNota(987.77, 0,    0.30, 'sine', 0.55);
            tocarNota(1318.51, 0.07, 0.75, 'sine', 0.65);
            tocarNota(2637.02, 0.07, 0.40, 'triangle', 0.25);
            break;

        case 'campana_4': // 4. Alerta Concurso TV (Triple Beep)
            tocarNota(880,    0,    0.11, 'triangle', 0.55);
            tocarNota(880,    0.14, 0.11, 'triangle', 0.55);
            tocarNota(1318.51, 0.28, 0.45, 'triangle', 0.70);
            break;

        case 'campana_5': // 5. Moneda Retro 8-Bit (Arcade)
            tocarNota(987.77, 0,    0.09, 'square', 0.35);
            tocarNota(1318.51, 0.09, 0.42, 'square', 0.38);
            break;

        case 'campana_6': // 6. Sirena Corta de Alerta
            tocarNota(550, 0,    0.22, 'sawtooth', 0.35, 1150);
            tocarNota(550, 0.24, 0.28, 'sawtooth', 0.38, 1250);
            break;

        case 'campana_7': // 7. Arpa / Cristal Mágico
            [1046.50, 1318.51, 1567.98, 2093.00].forEach((f, idx) => {
                tocarNota(f, idx * 0.065, 0.55, 'sine', 0.50);
                tocarNota(f * 2, idx * 0.065, 0.25, 'triangle', 0.15);
            });
            break;

        case 'campana_8': // 8. Sonar / Radar Submarino
            tocarNota(1174.66, 0,    0.45, 'sine', 0.65);
            tocarNota(1174.66, 0.30, 0.55, 'sine', 0.28);
            break;

        case 'campana_9': // 9. Trompeta de Aviso (Ta-Dá)
            tocarNota(523.25, 0,    0.15, 'sawtooth', 0.32);
            tocarNota(1046.50, 0,   0.15, 'triangle', 0.25);
            tocarNota(783.99, 0.17, 0.55, 'sawtooth', 0.38);
            tocarNota(1567.98, 0.17, 0.55, 'triangle', 0.28);
            break;

        case 'campana_10': // 10. Láser / Sci-Fi Energético
            tocarNota(1900, 0,    0.16, 'sawtooth', 0.40, 320);
            tocarNota(420,  0.17, 0.28, 'sine',     0.55, 1480);
            break;

        default:
            tocarNota(1567.98, 0, 0.85, 'sine', 0.65);
            break;
    }
}

function obtenerIntervaloTactacPorTipo(tipo, duracionCasilla) {
    const base = Math.max(70, Math.min(140, Math.round((duracionCasilla || 260) / 2)));
    switch (tipo) {
        case 'tactac_3': return 65;  // Redoble rápido
        case 'tactac_4': return 85;  // Cascada jackpot
        case 'tactac_8': return 135; // Palmas rítmicas
        case 'tactac_9': return 140; // Fanfarria
        case 'tactac_10': return 150; // Sirena
        default: return base;
    }
}

function dispararPasoTactacPorTipo(ctx, tipo, vol, paso) {
    if (!ctx || vol <= 0) return;
    const t0 = ctx.currentTime;

    const pulsoTono = (freqIni, freqFin, dur, waveType, peakGain, delay) => {
        const start = t0 + (delay || 0);
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = waveType || 'sine';
        osc.frequency.setValueAtTime(freqIni, start);
        if (freqFin && freqFin !== freqIni) {
            osc.frequency.exponentialRampToValueAtTime(freqFin, start + dur);
        }
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.linearRampToValueAtTime(Math.max(0.001, vol * peakGain), start + 0.004);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(start);
        osc.stop(start + dur + 0.01);
    };

    const pulsoRuido = (dur, filterFreq, qVal, peakGain, delay) => {
        const start = t0 + (delay || 0);
        const bufferSize = Math.max(64, Math.floor(ctx.sampleRate * dur));
        const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.35));
        }
        const noise = ctx.createBufferSource();
        noise.buffer = noiseBuffer;
        const filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(filterFreq, start);
        filter.Q.setValueAtTime(qVal, start);
        const gain = ctx.createGain();
        gain.gain.setValueAtTime(Math.max(0.001, vol * peakGain), start);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        noise.start(start);
    };

    switch (tipo) {
        case 'tactac_1': { // 1. Tac-Tac de Madera Clásico (Seco y limpio)
            const f1 = (paso % 2 === 0) ? 820 : 660;
            const f2 = (paso % 2 === 0) ? 460 : 370;
            pulsoTono(f1, f2, 0.042, 'sine', 0.75);
            pulsoTono(f1 * 1.5, f2 * 1.4, 0.022, 'triangle', 0.25);
            break;
        }
        case 'tactac_2': { // 2. Ruleta de Casino (Click Mecánico)
            const f = (paso % 2 === 0) ? 1650 : 1420;
            pulsoTono(f, 320, 0.025, 'triangle', 0.70);
            pulsoRuido(0.014, 3200, 3.5, 0.45);
            break;
        }
        case 'tactac_3': { // 3. Redoble de Tambor (Caja Militar)
            pulsoTono(195, 95, 0.045, 'triangle', 0.55);
            pulsoRuido(0.048, 1800, 1.2, 0.50);
            break;
        }
        case 'tactac_4': { // 4. Jackpot Tragamonedas (Cascada de Monedas)
            const notas = [1567.98, 1975.53, 2349.32, 2637.02];
            const nota = notas[paso % notas.length];
            pulsoTono(nota, nota, 0.09, 'sine', 0.60);
            pulsoTono(nota * 2, nota * 2, 0.045, 'triangle', 0.22);
            break;
        }
        case 'tactac_5': { // 5. Xilófono / Marimba Festiva
            const escala = [1046.50, 1174.66, 1318.51, 1567.98, 1760.00, 2093.00];
            const n = escala[paso % escala.length];
            pulsoTono(n, n * 0.99, 0.085, 'sine', 0.68);
            pulsoTono(n * 3, n * 3, 0.025, 'sine', 0.18);
            break;
        }
        case 'tactac_6': { // 6. Victoria Arcade 8-Bit
            const arp = [523.25, 659.25, 783.99, 1046.50, 783.99, 1046.50];
            const f = arp[paso % arp.length];
            pulsoTono(f, f, 0.075, 'square', 0.35);
            break;
        }
        case 'tactac_7': { // 7. Repique de Campanas de Fiesta
            const campanas = [1318.51, 1567.98, 2093.00, 1567.98];
            const c = campanas[paso % campanas.length];
            pulsoTono(c, c, 0.11, 'sine', 0.60);
            pulsoTono(c * 2.75, c * 2.75, 0.05, 'triangle', 0.22);
            break;
        }
        case 'tactac_8': { // 8. Palmas / Aplausos Rítmicos
            pulsoRuido(0.035, 1300, 1.8, 0.55, 0);
            pulsoRuido(0.038, 1450, 2.0, 0.50, 0.012);
            pulsoRuido(0.055, 1150, 1.5, 0.60, 0.024);
            break;
        }
        case 'tactac_9': { // 9. Fanfarria Triunfal de Bronces
            const fanf = [523.25, 659.25, 783.99, 1046.50];
            const bf = fanf[paso % fanf.length];
            pulsoTono(bf, bf, 0.11, 'sawtooth', 0.32);
            pulsoTono(bf * 1.5, bf * 1.5, 0.10, 'triangle', 0.28);
            break;
        }
        case 'tactac_10': { // 10. Sirena Ganadora de Concurso
            const sube = (paso % 2 === 0);
            pulsoTono(sube ? 580 : 1160, sube ? 1160 : 580, 0.135, 'triangle', 0.55);
            pulsoTono(sube ? 1160 : 1740, sube ? 1740 : 1160, 0.12, 'sine', 0.25);
            break;
        }
        default: {
            const f1 = (paso % 2 === 0) ? 820 : 660;
            pulsoTono(f1, 420, 0.042, 'sine', 0.75);
            break;
        }
    }
}

function detenerPreviewTactacConfig() {
    if (_previewTactacInterval) {
        clearInterval(_previewTactacInterval);
        _previewTactacInterval = null;
    }
    if (_previewTactacTimeout) {
        clearTimeout(_previewTactacTimeout);
        _previewTactacTimeout = null;
    }
}

function probarSonidoCampanaConfig() {
    detenerPreviewTactacConfig();
    const sel = document.getElementById('sonidoCampanaTipo');
    const rango = document.getElementById('sonidoCampanaVolumen');
    const tipo = sel ? sel.value : (localStorage.getItem('sonidoCampanaTipo') || 'campana_1');
    const vol = rango ? (parseFloat(rango.value) / 100) : 0.85;
    const ctx = obtenerBingoAudioCtx();
    ejecutarSonidoCampana(ctx, tipo, vol);
}

function probarSonidoTactacConfig() {
    detenerPreviewTactacConfig();
    const sel = document.getElementById('sonidoTactacTipo');
    const rango = document.getElementById('sonidoTactacVolumen');
    const tipo = sel ? sel.value : (localStorage.getItem('sonidoTactacTipo') || 'tactac_1');
    const vol = rango ? (parseFloat(rango.value) / 100) : 0.95;
    if (vol <= 0) return;
    const ctx = obtenerBingoAudioCtx();
    if (!ctx) return;

    let paso = 0;
    dispararPasoTactacPorTipo(ctx, tipo, vol, paso++);
    const intervalo = obtenerIntervaloTactacPorTipo(tipo, 240);
    _previewTactacInterval = setInterval(() => {
        dispararPasoTactacPorTipo(ctx, tipo, vol, paso++);
    }, intervalo);

    _previewTactacTimeout = setTimeout(() => {
        detenerPreviewTactacConfig();
    }, 1500);
}

           function reproducirTactac(duracion) {
            try {
                detenerTactac();
                const vol = obtenerVolumenSonido('sonidoTactacVolumen', 0.95);
                if (vol <= 0) return;
                const tipo = obtenerTipoSonido('sonidoTactacTipo', 'tactac_1');
                const ctx = obtenerAudioCtx();
                if (!ctx) return;

                tactacPaso = 0;
                dispararPasoTactacPorTipo(ctx, tipo, vol, tactacPaso++);

                const intervalo = obtenerIntervaloTactacPorTipo(tipo, duracion || DURACION_POR_CASILLA);
                tactacIntervalId = setInterval(() => {
                    const v = obtenerVolumenSonido('sonidoTactacVolumen', 0.95);
                    if (v <= 0) return;
                    const t = obtenerTipoSonido('sonidoTactacTipo', 'tactac_1');
                    dispararPasoTactacPorTipo(ctx, t, v, tactacPaso++);
                }, intervalo);
            } catch (e) {}
        }

        function detenerTactac() {
            if (tactacIntervalId) {
                clearInterval(tactacIntervalId);
                tactacIntervalId = null;
            }
        }

        function iniciarMusicaFondo() {
            if (!audioMusica) return;
            if (musicaIniciada) return;
            musicaIniciada = true;
            try {
                audioMusica.volume = 0;
                audioMusica.currentTime = 0;
                const p = audioMusica.play();
                if (p && p.then) {
                    p.then(() => hacerFadeInMusica(1500))
                     .catch(() => { musicaIniciada = false; });
                } else {
                    hacerFadeInMusica(1500);
                }
            } catch (e) {
                musicaIniciada = false;
            }
        }

        function desbloquearSonidos() {
            if (desbloqueoSonidoHecho) return;

            try {
                obtenerAudioCtx();
            } catch (e) {}
            iniciarMusicaFondo();

            const celdas = carton.querySelectorAll('.carton-grid-inner .celda');
            const faltan = [];
            for (let f = 0; f < 5; f++) {
                for (let c = 0; c < 5; c++) {
                    if (patron && patron[f][c] !== 1) continue;
                    const celda = celdas[f * 5 + c];
                    if (!celda || celdaEstaMarcada(celda)) continue;

                    if (v) faltan.push(v);

        function obtenerBolaInteligente() {
            const alAzar = (lista) => {
                if (!lista || lista.length === 0) return undefined;
                return lista[Math.floor(Math.random() * lista.length)];
            };

            if (bombo.length === 0) return undefined;
            if (bombo.length === 1) return bombo[0];

            const cartones = Array.from(document.querySelectorAll('.cartones-grid.modo-15 .carton'));
            const patronFigura = FIGURAS[figuraActual] || FIGURA_DIAGONAL.patron;
            const hayCartonElegido = CLICK_INVISIBLE
                && cartonForzadoIdx >= 0
                && cartonForzadoIdx < cartones.length
                && !cartones[cartonForzadoIdx].classList.contains('fuera-de-juego');

            // Sin un cartón seleccionado, se conserva exactamente el sorteo
            // aleatorio protegido que ya tenía el juego.
            if (!hayCartonElegido) {
                const peligrosas = new Set();
                cartones.forEach((carton) => {
                    if (carton.classList.contains('fuera-de-juego')) return;
                    const fBingo = numerosFaltantesCarton(carton, null);
                    if (figuraYaGanada && carton.classList.contains('ganador-figura-1') && fBingo.length === 1) {
                        peligrosas.add(fBingo[0]);
                    }
                    if (!figuraYaGanada && fBingo.length === 1) {
                        const fFig = numerosFaltantesCarton(carton, patronFigura);
                        if (fFig.length === 1) peligrosas.add(fBingo[0]);
                    }
                });
                const seguras = bombo.filter(n => !peligrosas.has(n));
                return alAzar(seguras.length > 0 ? seguras : bombo);
            }

            const idxObjetivo = cartonForzadoIdx;
            const objetivo = cartones[idxObjetivo];

            const quiereFigura = MODO_JUEGO !== 'bingo' && CANTIDAD_FIGURAS >= 1 && !figuraYaGanada
                && (MODO_JUEGO !== 'mixto' || cartonesAsignadosFigura.has(idxObjetivo));
            const quiereBingo = MODO_JUEGO !== 'figura' && !llenoYaGanado
                && (MODO_JUEGO !== 'mixto' || cartonesAsignadosBingo.has(idxObjetivo));
            if (!quiereFigura && !quiereBingo) return alAzar(bombo);

            // Se trabaja una meta a la vez: primero la figura y, cuando ya
            // se ganó, el bingo. Así el avance del bingo no se acelera junto
            // con el de la figura.
            const esMetaFigura = quiereFigura;
            const necesarios = (esMetaFigura
                ? numerosFaltantesCarton(objetivo, patronFigura)
                : numerosFaltantesCarton(objetivo, null)).filter(n => bombo.includes(n));
            if (necesarios.length === 0) return alAzar(bombo);

            const peligrosas = new Set();
            const compartidasUrgentes = [];

            cartones.forEach((carton, idx) => {
                if (idx === idxObjetivo) return;
                if (carton.classList.contains('fuera-de-juego')) return;

                if (esMetaFigura && !carton.classList.contains('ganador-figura-1')
                    && (MODO_JUEGO !== 'mixto' || cartonesAsignadosFigura.has(idx))) {
                    const f = numerosFaltantesCarton(carton, patronFigura);
                    if (f.length === 1) peligrosas.add(f[0]);
                    else if (f.length === 2) {
                        f.forEach(n => { if (necesarios.includes(n)) compartidasUrgentes.push(n); });
                    }
                }

                if (quiereBingo && !carton.classList.contains('ganador-bingo')
                    && (MODO_JUEGO !== 'mixto' || cartonesAsignadosBingo.has(idx))) {
                    const f = numerosFaltantesCarton(carton, null);
                    if (f.length === 1) peligrosas.add(f[0]);
                    else if (f.length === 2) {
                        f.forEach(n => { if (necesarios.includes(n)) compartidasUrgentes.push(n); });
                    }
                }
            });

            const seguras = bombo.filter(n => !peligrosas.has(n));
            const necesariasSeguras = necesarios.filter(n => !peligrosas.has(n) || necesarios.length === 1);
            const urgentesSeguras = compartidasUrgentes.filter(n => !peligrosas.has(n) && bombo.includes(n));

            // Probabilidad gradual: al principio predominan las bolas neutrales.
            // A medida que faltan menos números, aumenta la posibilidad de
            // ayudar al cartón elegido sin garantizarle la siguiente bola.
            let probabilidadForzar;
            if (esMetaFigura) {
                // La figura necesita menos casillas, por eso su ayuda es
                // deliberadamente más baja para que no se complete tan pronto.
                if (necesarios.length >= 4) probabilidadForzar = 0.03;
                else if (necesarios.length === 3) probabilidadForzar = 0.05;
                else if (necesarios.length === 2) probabilidadForzar = 0.08;
                else probabilidadForzar = 0.13;

                // Refuerzo moderado solo cuando el bombo ya está avanzado.
                if (bombo.length <= necesarios.length + 8) probabilidadForzar += 0.04;
                if (bombo.length <= necesarios.length + 4) probabilidadForzar += 0.06;
                if (bombo.length <= necesarios.length + 2) probabilidadForzar += 0.08;
                probabilidadForzar = Math.min(0.42, probabilidadForzar);
            } else {
                // El bingo tiene 15 casillas: se conserva una ayuda gradual,
                // ligeramente menor que antes para darle algo más de recorrido.
                if (necesarios.length > 16) probabilidadForzar = 0.06;
                else if (necesarios.length > 10) probabilidadForzar = 0.09;
                else if (necesarios.length > 6) probabilidadForzar = 0.13;
                else if (necesarios.length > 3) probabilidadForzar = 0.19;
                else if (necesarios.length > 1) probabilidadForzar = 0.27;
                else probabilidadForzar = 0.36;

                // El refuerzo final del bingo es un poco mayor que el de figura,
                // pero sigue sin garantizar que la siguiente bola sea útil.
                if (bombo.length <= necesarios.length + 8) probabilidadForzar += 0.06;
                if (bombo.length <= necesarios.length + 4) probabilidadForzar += 0.08;
                if (bombo.length <= necesarios.length + 2) probabilidadForzar += 0.10;
                probabilidadForzar = Math.min(0.60, probabilidadForzar);
            }

            const forzarAhora = necesariasSeguras.length > 0
                && Math.random() < probabilidadForzar;

            if (forzarAhora) {
                // Si hay números que también acercan a un rival a su aviso,
                // se conservan como prioridad ocasional, sin forzarlos siempre.
                if (urgentesSeguras.length > 0 && Math.random() < 0.35) {
                    return alAzar(urgentesSeguras);
                }
                return alAzar(necesariasSeguras);
            }

            // En los demás turnos sale una bola neutral/segura. Si no queda
            // ninguna alternativa, se usa el bombo completo para no bloquear.
            const poolNeutral = seguras.length > 0 ? seguras : bombo;
            return alAzar(poolNeutral);
        }

            const idxTema = PALETAS.findIndex(p => p.nombre === temaNombre);
            if (idxTema !== -1) return PALETAS[idxTema];
            return PALETAS[paletaActual];

                    const rect = b.getBoundingClientRect();
                    const ancho = rect.width;
                    const alto = rect.height;
                    if (ancho <= 0 || alto <= 0) return;
                    const promedio = (ancho + alto) / 2;
                    let font = promedio * 0.45;
                    if (font > 16) font = 16;
                    if (font < 5) font = 5;
                    b.style.fontSize = font + 'px';
                    b.style.lineHeight = '1';
                });
                panelControl.style.padding = '5px';

        function extraerNombresDeData(data) {
            const cartones = data.cartones || [];
            const nombres = [];
            for (let i = 0; i < cartones.length && i < 15; i++) {
                const lineas = cartones[i].lineas || [];
                let nombreEncontrado = "";
                for (const linea of lineas) {
                    if (linea.nombre && linea.nombre.trim() !== "" && linea.estado !== "libre") {
                        nombreEncontrado = linea.nombre.trim();
                        break;
                    }
                }
                nombres.push(nombreEncontrado);
            }
            return nombres;
        }

        function suscribirNombresFirebase() {
            if (!docRef || !USAR_BASE_DATOS) return;
            if (unsubscribeSnapshot) {
                try { unsubscribeSnapshot(); } catch (e) {}
                unsubscribeSnapshot = null;
            }
            unsubscribeSnapshot = onSnapshot(docRef,
                (snap) => {
                    if (!snap.exists()) return;
                    const data = snap.data();
                    const nuevosNombres = extraerNombresDeData(data);
                    if (JSON.stringify(nuevosNombres) !== JSON.stringify(nombresDeFirebase)) {
                        nombresDeFirebase = nuevosNombres;
                        const grid = document.getElementById('cartonesGrid');
                        if (grid && grid.children.length > 0) actualizarTextosDeCartones();
                    }
                },
                (error) => { console.warn("⚠️ Error Firebase:", error); }
            );
        }

        function actualizarTextosDeCartones() {
            const cartones = document.querySelectorAll('.cartones-grid .carton');
            cartones.forEach((carton, i) => {
                let textoCabecera = `CARTÓN ${i + 1}`;
                if (USAR_BASE_DATOS && nombresDeFirebase[i] && nombresDeFirebase[i].trim() !== "") {
                    textoCabecera = `${i + 1} - ${nombresDeFirebase[i]}`;

                const headerSpan = carton.querySelector('.carton-title');
                if (headerSpan) {
                    headerSpan.textContent = textoCabecera;

                }

        function generarCarton75() {
            const columnas = { B: [], I: [], N: [], G: [], O: [] };
            Object.keys(RANGOS_BINGO).forEach(letra => {
                const [min, max] = RANGOS_BINGO[letra];
                while (columnas[letra].length < 5) {
                    let num = Math.floor(Math.random() * (max - min + 1)) + min;
                    if (!columnas[letra].includes(num)) columnas[letra].push(num);
                }
            });
            return columnas;
        }

        function obtenerLetra(num) {
            if (num <= 15) return 'B';
            if (num <= 30) return 'I';
            if (num <= 45) return 'N';
            if (num <= 60) return 'G';
            return 'O';
        }

        function cargarVocesDisponibles() {
            if (!('speechSynthesis' in window)) return;
            const todas = window.speechSynthesis.getVoices();
            vocesDisponibles = todas.filter(v => v.lang && v.lang.toLowerCase().startsWith('es'));
        }

        function initVoces() {
            if (!('speechSynthesis' in window)) return;
            cargarVocesDisponibles();
            if (window.speechSynthesis.onvoiceschanged !== undefined) {
                window.speechSynthesis.onvoiceschanged = cargarVocesDisponibles;
            }
        }

        function cantarBola(numero) {
            if (!VOZ_ACTIVADA) return;
            if (!('speechSynthesis' in window)) return;
            if (vocesDisponibles.length === 0) return;

            const letra = obtenerLetra(numero);
            const texto = `${letra} ${numero}`;

            try { window.speechSynthesis.cancel(); } catch (e) {}

            const hablar = () => {
                const utter = new SpeechSynthesisUtterance(texto);
                utter.volume = VOZ_VOLUMEN;
                utter.rate = VOZ_VELOCIDAD;
                utter.pitch = VOZ_TONO;
                utter.lang = 'es-ES';

                if (VOZ_SELECCIONADA) {
                    const voz = vocesDisponibles.find(v => v.name === VOZ_SELECCIONADA);
                    if (voz) { utter.voice = voz; utter.lang = voz.lang; }
                    else { utter.voice = vocesDisponibles[0]; utter.lang = vocesDisponibles[0].lang; }
                } else {
                    utter.voice = vocesDisponibles[0];
                    utter.lang = vocesDisponibles[0].lang;
                }
                window.speechSynthesis.speak(utter);
            };

            for (let i = 0; i < VOZ_REPETIR; i++) {
                if (i === 0) hablar();
                else setTimeout(hablar, 1200 * i);
            }
        }

        function desbloquearVoz() {
            if (!('speechSynthesis' in window)) return;
            try {
                const u = new SpeechSynthesisUtterance('');
                u.volume = 0;
                window.speechSynthesis.speak(u);
            } catch (e) {}
        }

        function aplicarParametrosResaltado() {
            const estiloComputado = getComputedStyle(document.body);
            const colorTema = estiloComputado.getPropertyValue('--color-figura').trim() || '#ffd700';

            let r = 255, g = 215, b = 0;
            if (colorTema.startsWith('#')) {
                const hex = colorTema.replace('#', '');
                if (hex.length === 6) {
                    r = parseInt(hex.substring(0, 2), 16);
                    g = parseInt(hex.substring(2, 4), 16);
                    b = parseInt(hex.substring(4, 6), 16);
                } else if (hex.length === 3) {
                    r = parseInt(hex[0] + hex[0], 16);
                    g = parseInt(hex[1] + hex[1], 16);
                    b = parseInt(hex[2] + hex[2], 16);
                }
            }

            document.body.style.setProperty('--color-figura-glow', `rgba(${r}, ${g}, ${b}, ${INTENSIDAD_GLOW / 100})`);
                  document.body.style.setProperty('--color-figura-suave', `rgba(${r}, ${g}, ${b}, ${INTENSIDAD_SUAVE / 100})`);
            document.body.style.setProperty('--color-bingo-glow', `rgba(${r}, ${g}, ${b}, ${INTENSIDAD_GLOW_BINGO / 100})`);
            document.body.style.setProperty('--color-bingo-suave', `rgba(${r}, ${g}, ${b}, ${INTENSIDAD_SUAVE_BINGO / 100})`);
            document.body.style.setProperty('--amarillo-glow', INTENSIDAD_GLOW_NUMERO / 100);

            while (elemento.scrollWidth > elemento.clientWidth && size > minSize) {

        function comprobarFiguraEnCartones() {
            if (MODO_JUEGO === 'bingo') return { hayGanador: false, infoGanadores: [] };
            if (MODO_JUEGO === 'mixto' && cartonesAsignadosFigura.size === 0) return { hayGanador: false, infoGanadores: [] };
            if (CANTIDAD_FIGURAS < 1) return { hayGanador: false, infoGanadores: [] };
            if (figuraYaGanada) return { hayGanador: false, infoGanadores: [] };

            const patronFigura = FIGURAS[figuraActual] || FIGURA_DIAGONAL.patron;
            if (!patronFigura) return { hayGanador: false, infoGanadores: [] };

            const cartones = document.querySelectorAll('.cartones-grid.modo-15 .carton');
            const infoGanadores = [];

            cartones.forEach((carton, idx) => {
                if (carton.classList.contains('fuera-de-juego')) return;
                if (carton.classList.contains('ganador-figura-1')) return;
                if (MODO_JUEGO === 'mixto' && !cartonesAsignadosFigura.has(idx)) return;

                const celdas = carton.querySelectorAll('.carton-grid-inner .celda');
                let completa = true;
                const celdasDeLaFigura = [];

                for (let f = 0; f < 5 && completa; f++) {
                    for (let c = 0; c < 5; c++) {
                        const idxCelda = f * 5 + c;
                        const celda = celdas[idxCelda];
                        if (!celda) { completa = false; break; }
                        if (patronFigura[f][c] !== 1) continue;
                        celdasDeLaFigura.push(celda);
                        const estaMarcada = celda.classList.contains('marcada') || celda.classList.contains('vacia');
                        if (!estaMarcada) { completa = false; break; }
                    }
                }
                if (completa) infoGanadores.push({ carton, celdasDeLaFigura });
            });

            return { hayGanador: infoGanadores.length > 0, infoGanadores };
        }

        function comprobarLlenoEnCartones() {
            if (MODO_JUEGO === 'figura') return { hayGanador: false, infoGanadores: [] };
            if (MODO_JUEGO === 'mixto' && cartonesAsignadosBingo.size === 0) return { hayGanador: false, infoGanadores: [] };
            if (llenoYaGanado) return { hayGanador: false, infoGanadores: [] };
            const cartones = document.querySelectorAll('.cartones-grid.modo-15 .carton');

                if (carton.classList.contains('fuera-de-juego')) return;
                if (carton.classList.contains('ganador-bingo')) return;
                if (MODO_JUEGO === 'mixto' && !cartonesAsignadosBingo.has(idx)) return;

                const celdas = carton.querySelectorAll('.carton-grid-inner .celda');
                let todasMarcadas = true;

                });
                if (todasMarcadas) infoGanadores.push({ carton, celdasDeLaFigura: celdasLleno });
            });

            return { hayGanador: infoGanadores.length > 0, infoGanadores };
        }

                    });
                });
                timeoutApagado = null;
            }, 500);
        }

        function mostrarRotulosDeGanadores() {
            document.querySelectorAll('.cartones-grid.modo-15 .carton').forEach(carton => {
                if (carton.classList.contains('fuera-de-juego')) return;
                if (modoAsignacionActivo) return;
                const ganoFigura = carton.classList.contains('ganador-figura-1');
                const ganoBingo = carton.classList.contains('ganador-bingo');
                const ganoTodo = ganoFigura && ganoBingo;
                if (ganoTodo) {
                    carton.classList.add('mostrar-rotulo-gana', 'mostrar-rotulo-todo');
                } else {
                    if (ganoBingo) carton.classList.add('mostrar-rotulo-bingo');
                    if (ganoFigura) carton.classList.add('mostrar-rotulo-figura');
                }
            });
            apagarResaltadoSuave();
        }

        function ejecutarAnimacionResaltado(cartonesInfo) {
            if (!cartonesInfo || cartonesInfo.length === 0) return Promise.resolve();
            const btn = document.getElementById('btnSacarBola');
            if (btn) btn.classList.add('bloqueado');
            bloqueadoPorAnimacion = true;

            let hayGanadorFigura = false;
            let hayGanadorBingo = false;
            cartonesInfo.forEach(({ ganoFigura, ganoBingo }) => {
                if (ganoFigura) hayGanadorFigura = true;
                if (ganoBingo) hayGanadorBingo = true;
            });
            if (hayGanadorFigura || hayGanadorBingo) {
                         reproducirTactac(hayGanadorBingo ? DURACION_POR_CASILLA_BINGO : DURACION_POR_CASILLA);
            }

            const PAUSA_FINAL = 600;
            cartonesInfo.forEach(({ carton, ganoFigura, ganoBingo }) => {
                if (ganoFigura) carton.classList.add('ganador-figura-1');
                if (ganoBingo) carton.classList.add('ganador-bingo');
                carton.classList.add('animando');
                carton.classList.remove('resaltando', 'secuencia-completa', 'apagando-resaltado');
            });

            timeoutsFase1.forEach(t => clearTimeout(t));
            timeoutsFase1 = [];

                      let duracionMaxima = 0;
            cartonesInfo.forEach(({ ganoBingo, celdasDeLaFigura }) => {
                const dur = ganoBingo ? DURACION_POR_CASILLA_BINGO : DURACION_POR_CASILLA;
                const lista = celdasDeLaFigura || [];
                duracionMaxima = Math.max(duracionMaxima, lista.length * dur);
                lista.forEach((celda, i) => {
                    const t = setTimeout(() => celda.classList.add('en-figura'), i * dur);
                    timeoutsFase1.push(t);
                });
            });

            const duracionTotal = duracionMaxima + PAUSA_FINAL;

            return new Promise((resolve) => {
                if (timeoutAnimacion) clearTimeout(timeoutAnimacion);
                timeoutAnimacion = setTimeout(() => {
                    detenerTactac();

                    cartonesInfo.forEach(({ carton }) => {
                        carton.classList.remove('animando');
                        carton.classList.add('resaltando', 'secuencia-completa');
                    });
                    if (partidaTerminada) {
                        if (timeoutRotulos) clearTimeout(timeoutRotulos);
                        timeoutRotulos = setTimeout(() => {
                            mostrarRotulosDeGanadores();
                            timeoutRotulos = null;
                        }, 1500);
                    }
                    if (btn) btn.classList.remove('bloqueado');
                    bloqueadoPorAnimacion = false;
                    timeoutAnimacion = null;
                    timeoutsFase1 = [];
                    resolve();
                }, duracionTotal);
            });
        }

        function estaAUno(carton, celdas, patronFigura) {
            if (carton.classList.contains('fuera-de-juego')) return false;

            const todosCartones = Array.from(document.querySelectorAll('.cartones-grid.modo-15 .carton'));
            const idxCarton = todosCartones.indexOf(carton);
            const enFigura = (MODO_JUEGO !== 'mixto') || cartonesAsignadosFigura.has(idxCarton);
            const enBingo = (MODO_JUEGO !== 'mixto') || cartonesAsignadosBingo.has(idxCarton);

            if (enFigura && MODO_JUEGO !== 'bingo' && !figuraYaGanada && !carton.classList.contains('ganador-figura-1') && CANTIDAD_FIGURAS >= 1) {
                let faltantes = 0, total = 0;
                for (let f = 0; f < 5; f++) {
                    for (let c = 0; c < 5; c++) {
                        if (patronFigura[f][c] !== 1) continue;
                        total++;
                        const celda = celdas[f * 5 + c];
                        if (!celda) continue;
                        const marcada = celda.classList.contains('marcada') || celda.classList.contains('vacia');
                        if (!marcada) faltantes++;
                    }
                }
                if (total > 0 && faltantes === 1) return true;
            }

            if (enBingo && !llenoYaGanado && !carton.classList.contains('ganador-bingo')) {
                let faltantes = 0;
                celdas.forEach(celda => {
                    const marcada = celda.classList.contains('marcada') || celda.classList.contains('vacia');
                    if (!marcada) faltantes++;
                });
                if (faltantes === 1) return true;
            }
            return false;
        }

        function detectarFaltaParaFigura(carton, celdas, patronFigura) {
            if (MODO_JUEGO === 'bingo') return false;
            if (carton.classList.contains('fuera-de-juego')) return false;
            if (CANTIDAD_FIGURAS < 1 || figuraYaGanada) return false;
            if (carton.classList.contains('ganador-figura-1')) return false;
            if (!patronFigura) return false;
            if (MODO_JUEGO === 'mixto') {
                const todos = Array.from(document.querySelectorAll('.cartones-grid.modo-15 .carton'));
                if (!cartonesAsignadosFigura.has(todos.indexOf(carton))) return false;
            }

            let faltantes = 0, total = 0;
            for (let f = 0; f < 5; f++) {
                for (let c = 0; c < 5; c++) {
                    if (patronFigura[f][c] !== 1) continue;
                    total++;
                    const celda = celdas[f * 5 + c];
                    if (!celda) continue;
                    const marcada = celda.classList.contains('marcada') || celda.classList.contains('vacia');
                    if (!marcada) faltantes++;
                }
            }
            return total > 0 && faltantes === 1;
        }

        function detectarFaltaParaBingo(carton, celdas) {
            if (MODO_JUEGO === 'figura') return false;
            if (carton.classList.contains('fuera-de-juego')) return false;
            if (llenoYaGanado || carton.classList.contains('ganador-bingo')) return false;
            if (MODO_JUEGO === 'mixto') {
                const todos = Array.from(document.querySelectorAll('.cartones-grid.modo-15 .carton'));
                if (!cartonesAsignadosBingo.has(todos.indexOf(carton))) return false;
            }
            let faltantes = 0;
            celdas.forEach(celda => {
                const marcada = celda.classList.contains('marcada') || celda.classList.contains('vacia');
                if (!marcada) faltantes++;
            });
            return faltantes === 1;
        }

        function obtenerCeldasFaltantes(carton, celdas, patronFigura) {
            const resultado = [];
            if (carton.classList.contains('fuera-de-juego')) return resultado;

            const todos = Array.from(document.querySelectorAll('.cartones-grid.modo-15 .carton'));
            const idxCarton = todos.indexOf(carton);
            const enFigura = (MODO_JUEGO !== 'mixto') || cartonesAsignadosFigura.has(idxCarton);
            const enBingo = (MODO_JUEGO !== 'mixto') || cartonesAsignadosBingo.has(idxCarton);

            if (enFigura && MODO_JUEGO !== 'bingo' && !figuraYaGanada && !carton.classList.contains('ganador-figura-1') && CANTIDAD_FIGURAS >= 1) {
                let faltantes = 0, total = 0, candidata = null;
                for (let f = 0; f < 5; f++) {
                    for (let c = 0; c < 5; c++) {
                        if (patronFigura[f][c] !== 1) continue;
                        total++;
                        const celda = celdas[f * 5 + c];
                        if (!celda) continue;
                        const marcada = celda.classList.contains('marcada') || celda.classList.contains('vacia');
                        if (!marcada) { faltantes++; candidata = celda; }
                    }
                }
                if (total > 0 && faltantes === 1 && candidata) resultado.push(candidata);
            }

            if (enBingo && MODO_JUEGO !== 'figura' && !llenoYaGanado && !carton.classList.contains('ganador-bingo')) {
                let faltantes = 0, candidata = null;
                celdas.forEach(celda => {
                    const marcada = celda.classList.contains('marcada') || celda.classList.contains('vacia');
                    if (!marcada) { faltantes++; candidata = celda; }
                });
                if (faltantes === 1 && candidata && !resultado.includes(candidata)) resultado.push(candidata);
            }
            return resultado;
        }

        function actualizarResaltadosAmarillos() {
            const cartones = document.querySelectorAll('.cartones-grid.modo-15 .carton');
            const patronFigura = FIGURAS[figuraActual] || FIGURA_DIAGONAL.patron;

            document.querySelectorAll('.cartones-grid.modo-15 .celda.falta-amarillo')
                .forEach(c => c.classList.remove('falta-amarillo'));

            if (partidaTerminada || modoAsignacionActivo) {
                document.querySelectorAll('.cartones-grid.modo-15 .carton.alerta-header')
                    .forEach(c => c.classList.remove('alerta-header'));
                return;
            }

            let hayNuevoDestello = false;
            cartones.forEach((carton) => {
                if (carton.classList.contains('fuera-de-juego')) {
                    carton.classList.remove('alerta-header');
                    carton.dataset.enAlerta = '0';
                    carton.dataset.pausadoPorSacar = '0';
                    carton.dataset.yaAvisoFigura = '0';
                    carton.dataset.yaAvisoBingo = '0';
                    return;
                }
                if (carton.classList.contains('ganador-bingo')) {
                    carton.classList.remove('alerta-header');
                    carton.dataset.enAlerta = '0';
                    carton.dataset.pausadoPorSacar = '0';
                    return;
                }

                const celdas = carton.querySelectorAll('.carton-grid-inner .celda');
                const faltaParaFigura = detectarFaltaParaFigura(carton, celdas, patronFigura);
                const faltaParaBingo = detectarFaltaParaBingo(carton, celdas);
                const celdasFaltantes = obtenerCeldasFaltantes(carton, celdas, patronFigura);
                if (celdasFaltantes.length > 0) celdasFaltantes.forEach(c => c.classList.add('falta-amarillo'));

                let debeParpadear = false;
                if (faltaParaFigura && carton.dataset.yaAvisoFigura !== '1') {
                    debeParpadear = true;
                    carton.dataset.yaAvisoFigura = '1';
                }
                if (faltaParaBingo && carton.dataset.yaAvisoBingo !== '1') {
                    debeParpadear = true;
                    carton.dataset.yaAvisoBingo = '1';
                }
                if (!faltaParaFigura && !carton.classList.contains('ganador-figura-1')) carton.dataset.yaAvisoFigura = '0';
                if (!faltaParaBingo) carton.dataset.yaAvisoBingo = '0';

                if (debeParpadear) {
                    carton.classList.add('alerta-header');
                    carton.dataset.enAlerta = '1';
                    hayNuevoDestello = true;
                } else {
                    carton.classList.remove('alerta-header');
                    if (!faltaParaFigura && !faltaParaBingo) {
                        carton.dataset.enAlerta = '0';
                        carton.dataset.pausadoPorSacar = '0';
                    }
                }
            });
            if (hayNuevoDestello) {
                reproducirCampana();
                bloquearBotonPorDestello();
            }
        }

        function bloquearBotonPorDestello() {
            const btn = document.getElementById('btnSacarBola');

            btn.classList.add('bloqueado');
            bloqueadoPorAnimacion = true;
            if (timeoutBloqueoDestello) clearTimeout(timeoutBloqueoDestello);

            }, 2000);

        function actualizarPuntosAlerta() {
            if (partidaTerminada) return;
            const cartones = document.querySelectorAll('.cartones-grid.modo-15 .carton');
            const patronFigura = FIGURAS[figuraActual] || FIGURA_DIAGONAL.patron;
            let puntosAAnimar = [];

            cartones.forEach((carton) => {
                const punto = carton.querySelector('.punto-alerta');
                if (!punto) return;
                if (carton.classList.contains('fuera-de-juego')) {
                    punto.classList.remove('activo', 'titilar');
                    return;
                }
                const celdas = carton.querySelectorAll('.carton-grid-inner .celda');
                const aUno = estaAUno(carton, celdas, patronFigura);
                if (aUno) {
                    if (!punto.classList.contains('activo')) {
                        punto.classList.add('activo');
                        punto.classList.remove('titilar');
                        puntosAAnimar.push(punto);
                    }
                } else {
                    punto.classList.remove('activo');
                }
            });

            if (puntosAAnimar.length > 0) {
                void document.body.offsetWidth;
                puntosAAnimar.forEach(punto => {
                    punto.classList.add('titilar');
                    setTimeout(() => punto.classList.remove('titilar'), 800);
                });
            }
        }

        function activarModoRevancha() {
            modoRevanchaActivo = true;
            cartonesSeleccionadosRevancha.clear();
            document.body.classList.add('modo-revancha');

            document.querySelectorAll('.cartones-grid.modo-15 .carton').forEach((carton, idx) => {
                if (cartonesFueraDeJuego.has(idx)) return;
                carton.classList.remove('seleccionado-revancha');
            });

            listenerRevanchaCartones = function(e) {
                const carton = e.target.closest('.cartones-grid.modo-15 .carton');
                if (!carton) return;
                if (!modoRevanchaActivo) return;

                e.stopPropagation();
                e.preventDefault();

                const todos = Array.from(document.querySelectorAll('.cartones-grid.modo-15 .carton'));
                const idx = todos.indexOf(carton);
                if (idx === -1) return;

                if (cartonesSeleccionadosRevancha.has(idx)) {
                    cartonesSeleccionadosRevancha.delete(idx);
                    carton.classList.remove('seleccionado-revancha');
                } else {
                    cartonesSeleccionadosRevancha.add(idx);
                    carton.classList.add('seleccionado-revancha');
                }

                actualizarBotonConfirmar();
            };

            document.addEventListener('click', listenerRevanchaCartones, true);
            actualizarBotonConfirmar();

        function activarModoAsignacion() {
            modoAsignacionActivo = true;
            cartonesAsignadosBingo.clear();
            cartonesAsignadosFigura.clear();
            document.body.classList.add('modo-asignacion');

            const todos = document.querySelectorAll('.cartones-grid.modo-15 .carton');
            todos.forEach(c => {
                c.classList.remove('asignado-bingo', 'asignado-figura');
            });

            listenerAsignacionCartones = function(e) {
                if (!modoAsignacionActivo) return;
                const carton = e.target.closest('.cartones-grid.modo-15 .carton');
                if (!carton) return;

                e.stopPropagation();
                e.preventDefault();

                const todosArr = Array.from(document.querySelectorAll('.cartones-grid.modo-15 .carton'));
                const idx = todosArr.indexOf(carton);
                if (idx === -1) return;

                if (cartonesAsignadosBingo.has(idx)) {
                    cartonesAsignadosBingo.delete(idx);
                    cartonesAsignadosFigura.add(idx);
                    carton.classList.remove('asignado-bingo');
                    carton.classList.add('asignado-figura');
                } else if (cartonesAsignadosFigura.has(idx)) {
                    cartonesAsignadosFigura.delete(idx);
                    carton.classList.remove('asignado-figura');
                } else {
                    cartonesAsignadosBingo.add(idx);
                    carton.classList.add('asignado-bingo');
                }
            };

            document.addEventListener('click', listenerAsignacionCartones, true);
            actualizarBotonConfirmarAsignacion();
        }

        function guardarPartida() {
            try {
                const cartones = [];
                document.querySelectorAll('.cartones-grid.modo-15 .carton').forEach((carton, idx) => {
                    const celdas = [];
                    carton.querySelectorAll('.carton-grid-inner .celda').forEach(celda => {
                        celdas.push({
                            valor: celda.dataset.valor || null,
                            marcada: celda.classList.contains('marcada'),
                            vacia: celda.classList.contains('vacia')
                        });
                    });
                    cartones.push({
                        index: idx,
                        titulo: carton.querySelector('.carton-title')?.textContent || '',
                        color: carton.style.getPropertyValue('--carton-color'),
                        colorDark: carton.style.getPropertyValue('--carton-color-dark'),
                        celdas: celdas,
                        ganoFigura: carton.classList.contains('ganador-figura-1'),
                        ganoBingo: carton.classList.contains('ganador-bingo'),
                        fueraDeJuego: carton.classList.contains('fuera-de-juego')
                    });
                });

                const partida = {
                    version: 1,
                    fecha: Date.now(),
                    totalCartones: TOTAL_CARTONES,
                    historialSacadas: historialSacadas.slice(),
                    bombo: bombo.slice(),
                    figuraYaGanada: figuraYaGanada,
                    llenoYaGanado: llenoYaGanado,
                    partidaTerminada: partidaTerminada,
                    paletaActual: paletaActual,
                    indiceRotacionActual: indiceRotacionActual,
                    figuraActual: figuraActual,
                    modoTemas: MODO_TEMAS,
                    modoJuego: MODO_JUEGO,
                    ccSecuenciaEnUso: CC_SECUENCIA_EN_USO,
                    cartonesFueraDeJuego: Array.from(cartonesFueraDeJuego),
                    cartonesAsignadosBingo: Array.from(cartonesAsignadosBingo),
                    cartonesAsignadosFigura: Array.from(cartonesAsignadosFigura),
                    cartones: cartones
                };

                localStorage.setItem('bingo_partida_guardada', JSON.stringify(partida));

                const btn = document.getElementById('btnGuardarPartida');
                if (btn) {
                    btn.classList.add('guardado');
                    btn.textContent = '✅ GUARDADO';
                    setTimeout(() => {
                        btn.classList.remove('guardado');
                        btn.textContent = '💾 GUARDAR';
                    }, 1200);
                }
            } catch (e) {
                console.error('Error guardando partida:', e);
                alert('No se pudo guardar la partida.');
            }
        }

        function cargarPartidaGuardada() {
            let partida = null;
            try {
                const raw = localStorage.getItem('bingo_partida_guardada');
                if (!raw) return false;
                partida = JSON.parse(raw);
                if (!partida || !Array.isArray(partida.cartones)) return false;
            } catch (e) { return false; }

            TOTAL_CARTONES = partida.totalCartones || TOTAL_CARTONES;
            historialSacadas = Array.isArray(partida.historialSacadas) ? partida.historialSacadas.slice() : [];
            bombo = Array.isArray(partida.bombo) ? partida.bombo.slice() : Array.from({ length: MAX_BALOTAS }, (_, i) => i + 1);
            figuraYaGanada = partida.figuraYaGanada === true;
            llenoYaGanado = partida.llenoYaGanado === true;
            partidaTerminada = partida.partidaTerminada === true;
            paletaActual = typeof partida.paletaActual === 'number' ? partida.paletaActual : 0;
            indiceRotacionActual = typeof partida.indiceRotacionActual === 'number' ? partida.indiceRotacionActual : 0;
            if (partida.figuraActual && FIGURAS[partida.figuraActual]) figuraActual = partida.figuraActual;
            if (partida.modoTemas === 'simple' || partida.modoTemas === 'combinado') MODO_TEMAS = partida.modoTemas;
            if (partida.modoJuego === 'figura' || partida.modoJuego === 'bingo' || partida.modoJuego === 'ambos' || partida.modoJuego === 'mixto') {
                MODO_JUEGO = partida.modoJuego;
            }
            if (partida.ccSecuenciaEnUso) CC_SECUENCIA_EN_USO = partida.ccSecuenciaEnUso;
            cartonesFueraDeJuego = new Set(Array.isArray(partida.cartonesFueraDeJuego) ? partida.cartonesFueraDeJuego : []);
            cartonesAsignadosBingo = new Set(Array.isArray(partida.cartonesAsignadosBingo) ? partida.cartonesAsignadosBingo : []);
            cartonesAsignadosFigura = new Set(Array.isArray(partida.cartonesAsignadosFigura) ? partida.cartonesAsignadosFigura : []);

            renderizarEstructura();

            if (MODO_JUEGO === 'mixto' && (cartonesAsignadosBingo.size > 0 || cartonesAsignadosFigura.size > 0)) {
                document.body.classList.add('modo-mixto-jugando');
                const todos = document.querySelectorAll('.cartones-grid.modo-15 .carton');
                todos.forEach((carton, idx) => {
                    const enBingo = cartonesAsignadosBingo.has(idx);
                    const enFigura = cartonesAsignadosFigura.has(idx);
                    if (enBingo) carton.classList.add('tiene-asignacion-bingo');
                    else if (enFigura) carton.classList.add('tiene-asignacion-figura');
                });
            }

            const cartonesDOM = document.querySelectorAll('.cartones-grid.modo-15 .carton');
            partida.cartones.forEach((dataCarton, idx) => {
                const carton = cartonesDOM[idx];
                if (!carton) return;

                if (dataCarton.color) carton.style.setProperty('--carton-color', dataCarton.color);
                if (dataCarton.colorDark) carton.style.setProperty('--carton-color-dark', dataCarton.colorDark);

                const titleEl = carton.querySelector('.carton-title');
                if (titleEl && dataCarton.titulo) titleEl.textContent = dataCarton.titulo;

                const celdasDOM = carton.querySelectorAll('.carton-grid-inner .celda');
                dataCarton.celdas.forEach((celdaData, iCelda) => {
                    const celda = celdasDOM[iCelda];
                    if (!celda) return;
                    if (celdaData.vacia) {
                        celda.classList.add('vacia');
                    } else if (celdaData.valor !== null && celdaData.valor !== undefined) {
                        celda.dataset.valor = celdaData.valor;
                        const numVal = celda.querySelector('.num-val');
                        if (numVal) numVal.textContent = celdaData.valor;
                    }
                    if (celdaData.marcada) {
                        celda.classList.add('marcada');
                        celda.classList.remove('animar-marca');
                    } else {
                        celda.classList.remove('marcada');
                    }
                });

                if (dataCarton.ganoFigura) carton.classList.add('ganador-figura-1');
                if (dataCarton.ganoBingo) carton.classList.add('ganador-bingo');
            });

            aplicarCartonesFueraDeJuego();

            const display = document.getElementById('numeroDisplay');
            if (display) {
                if (historialSacadas.length > 0) {
                    display.textContent = historialSacadas[0].numero;
                    const sphere = document.getElementById('bolilleroSphere');
                    if (sphere) sphere.style.setProperty('--bola-exterior', colorBolaParaNumero(historialSacadas[0].numero));
                } else {
                    display.textContent = '--';
                }
            }

            const stats = document.getElementById('statsDisplay');
            if (stats) stats.textContent = `${historialSacadas.length}/${MAX_BALOTAS}`;

            const recientesLista = document.getElementById('recientesLista');
            if (recientesLista) {
                recientesLista.innerHTML = '';
                historialSacadas.slice(1, 7).forEach(item => {
                    const bola = document.createElement('div');
                    bola.className = 'mini-bola';
                    bola.style.setProperty('--bola-bg', colorBolaParaNumero(item.numero));
                    bola.innerHTML = `<span>${item.numero}</span>`;
                    recientesLista.appendChild(bola);
                });
            }

            historialSacadas.forEach(item => {
                const ctrlEl = document.getElementById(`ctrl-${item.numero}`);
                if (ctrlEl) {
                    ctrlEl.classList.add('marcada');
                    ctrlEl.classList.remove('clickeable');
                    ctrlEl.style.pointerEvents = 'none';
                }
            });

            aplicarPaleta();
            aplicarTamanoControl();
            aplicarConfigFiguras();
            aplicarEspacioNotch();
            aplicarBloqueoScroll();

            setTimeout(() => {
                actualizarPuntosAlerta();
                actualizarResaltadosAmarillos();
            }, 300);

            return true;
        }

        function ejecutarSaqueDeBola(numero) {
            const sphere = document.getElementById('bolilleroSphere');

            document.querySelectorAll('.cartones-grid.modo-15 .carton.alerta-header')
                .forEach(c => c.classList.remove('alerta-header'));

            actualizarPuntosAlerta();
            apagarResaltadoDeTodos();

            if (timeoutRotulos) { clearTimeout(timeoutRotulos); timeoutRotulos = null; }
            if (timeoutApagado) { clearTimeout(timeoutApagado); timeoutApagado = null; }

            const ejecutarEntradaNuevaBola = () => {
                const idx = bombo.indexOf(numero);
                if (idx === -1) return;
                bombo.splice(idx, 1);

                const letra = obtenerLetra(numero);
                historialSacadas.unshift({ numero, letra });

                const display = document.getElementById('numeroDisplay');
                if (display) display.textContent = numero;

                cantarBola(numero);

                if (sphere) {
                    sphere.style.setProperty('--bola-exterior', colorBolaParaNumero(numero));
                    sphere.classList.remove('rodar-salida', 'rodar-entrada');
                    void sphere.offsetWidth;
                    sphere.classList.add('rodar-entrada');
                }

                const stats = document.getElementById('statsDisplay');
                if (stats) stats.textContent = `${historialSacadas.length}/${MAX_BALOTAS}`;

                document.querySelectorAll(`.celda[data-valor="${numero}"]`).forEach(el => {
                    el.classList.add('marcada');
                    el.classList.add('animar-marca');
                    setTimeout(() => el.classList.remove('animar-marca'), 1200);
                });

                const ctrlEl = document.getElementById(`ctrl-${numero}`);
                if (ctrlEl) {
                    ctrlEl.classList.add('marcada');
                    ctrlEl.classList.remove('clickeable');
                    ctrlEl.style.pointerEvents = 'none';
                }

                const recientesLista = document.getElementById('recientesLista');
                if (recientesLista) {
                    recientesLista.innerHTML = '';
                    historialSacadas.slice(1, 7).forEach(item => {
                        const bola = document.createElement('div');
                        bola.className = 'mini-bola entrando';
                        bola.style.setProperty('--bola-bg', colorBolaParaNumero(item.numero));
                        bola.innerHTML = `<span>${item.numero}</span>`;
                        recientesLista.appendChild(bola);
                    });
                }

                setTimeout(() => {
                    if (sphere) sphere.classList.remove('rodar-entrada');

                    const resultadoFigura = comprobarFiguraEnCartones();
                    const resultadoLleno = comprobarLlenoEnCartones();
                    const cartonesGanadores = new Map();

                    if (resultadoFigura.hayGanador) {
                        figuraYaGanada = true;
                        resultadoFigura.infoGanadores.forEach(info => {
                            cartonesGanadores.set(info.carton, {
                                carton: info.carton,
                                celdasDeLaFigura: info.celdasDeLaFigura || [],
                                ganoFigura: true,
                                ganoBingo: false
                            });
                        });
                    }

                    if (resultadoLleno.hayGanador) {
                        llenoYaGanado = true;
                        partidaTerminada = true;
                        resultadoLleno.infoGanadores.forEach(info => {
                            if (cartonesGanadores.has(info.carton)) {
                                cartonesGanadores.get(info.carton).ganoBingo = true;
                            } else {
                                cartonesGanadores.set(info.carton, {
                                    carton: info.carton,
                                    celdasDeLaFigura: info.celdasDeLaFigura || [],
                                    ganoFigura: false,
                                    ganoBingo: true
                                });
                            }
                        });
                    }

                    if (MODO_JUEGO === 'figura' && figuraYaGanada) {
                        partidaTerminada = true;
                    }

                    if (MODO_JUEGO === 'mixto') {
                        const figuraOk = (cartonesAsignadosFigura.size === 0) || figuraYaGanada;
                        const bingoOk = (cartonesAsignadosBingo.size === 0) || llenoYaGanado;
                        if (figuraOk && bingoOk) {
                            partidaTerminada = true;
                        }
                    }

                    if (cartonesGanadores.size > 0) {
                        detenerAuto();
                        ejecutarAnimacionResaltado(Array.from(cartonesGanadores.values())).then(() => {
                            actualizarResaltadosAmarillos();
                            liberarBloqueo();
                        });
                    } else {
                        actualizarResaltadosAmarillos();
                        liberarBloqueo();
                    }
                }, VELOCIDAD_BOLA);
            };

            const liberarBloqueo = () => {
                isAnimating = false;
                const b = document.getElementById('btnSacarBola');
                if (b) { b.classList.remove('presionado'); b.classList.remove('bloqueado'); }
            };

            if (historialSacadas.length === 0) {
                ejecutarEntradaNuevaBola();
            } else {
                if (sphere) {
                    sphere.classList.remove('rodar-entrada', 'rodar-salida');
                    void sphere.offsetWidth;
                    sphere.classList.add('rodar-salida');
                    setTimeout(ejecutarEntradaNuevaBola, 480);
                } else {
                    ejecutarEntradaNuevaBola();
                }
            }
        }

        function sacarBola(e) {
            if (modoAsignacionActivo) return;
            if (isAnimating || bloqueadoPorAnimacion) return;
            if (bombo.length === 0) return;
            if (modoRevanchaActivo) return;

            if (autoActivo) detenerAuto();

            desbloquearSonidos();

            const btn = document.getElementById('btnSacarBola');
            if (btn) {
                btn.classList.add('bloqueado');
                btn.classList.remove('presionado');
                void btn.offsetWidth;
                btn.classList.add('presionado');
            }
            isAnimating = true;
            ejecutarSaqueDeBola(obtenerBolaInteligente());
        }

        function sacarBolaEspecifica(numero) {
            if (modoAsignacionActivo) return;
            if (isAnimating || bloqueadoPorAnimacion) return;
            if (partidaTerminada) return;
            if (modoRevanchaActivo) return;
            if (historialSacadas.some(h => h.numero === numero)) return;
            if (bombo.indexOf(numero) === -1) return;

            if (autoActivo) detenerAuto();

            desbloquearSonidos();

            const btn = document.getElementById('btnSacarBola');
            if (btn) {
                btn.classList.add('bloqueado');
                btn.classList.remove('presionado');
                void btn.offsetWidth;
                btn.classList.add('presionado');
            }
            isAnimating = true;
            ejecutarSaqueDeBola(numero);
        }

        function reiniciarJuego() {
            detenerAuto();
            cartonForzadoIdx = -1;
            bombo = Array.from({ length: MAX_BALOTAS }, (_, i) => i + 1);
            historialSacadas = [];
            const display = document.getElementById('numeroDisplay');
            if (display) display.textContent = '--';
            const stats = document.getElementById('statsDisplay');
            if (stats) stats.textContent = `0/${MAX_BALOTAS}`;
            const recientes = document.getElementById('recientesLista');
            if (recientes) recientes.innerHTML = '';
            if (timeoutAnimacion) { clearTimeout(timeoutAnimacion); timeoutAnimacion = null; }
            if (timeoutRotulos) { clearTimeout(timeoutRotulos); timeoutRotulos = null; }
            if (timeoutApagado) { clearTimeout(timeoutApagado); timeoutApagado = null; }
            if (timeoutBloqueoDestello) { clearTimeout(timeoutBloqueoDestello); timeoutBloqueoDestello = null; }
            timeoutsFase1.forEach(t => clearTimeout(t));
            timeoutsFase1 = [];
            detenerTactac();
            bloqueadoPorAnimacion = false;
            isAnimating = false;
            figuraYaGanada = false;
            llenoYaGanado = false;
            partidaTerminada = false;
            celdasCentroPendientes = 0;
            const btn = document.getElementById('btnSacarBola');
            if (btn) btn.classList.remove('bloqueado', 'presionado');
            document.querySelectorAll('.cartones-grid.modo-15 .celda.falta-amarillo').forEach(c => c.classList.remove('falta-amarillo'));
            document.querySelectorAll('.cartones-grid.modo-15 .carton.alerta-header').forEach(c => c.classList.remove('alerta-header'));
            document.querySelectorAll('.cartones-grid.modo-15 .carton .punto-alerta').forEach(p => p.classList.remove('activo', 'titilar'));
            document.querySelectorAll('.cartones-grid.modo-15 .carton').forEach(c => {
                c.dataset.enAlerta = '0';
                c.dataset.pausadoPorSacar = '0';
                c.dataset.yaAvisoFigura = '0';
                c.dataset.yaAvisoBingo = '0';
            });
            renderizarEstructura();

            if (MODO_JUEGO === 'mixto' && (cartonesAsignadosBingo.size > 0 || cartonesAsignadosFigura.size > 0)) {
                const todos = document.querySelectorAll('.cartones-grid.modo-15 .carton');
                todos.forEach((carton, idx) => {
                    const enBingo = cartonesAsignadosBingo.has(idx);
                    const enFigura = cartonesAsignadosFigura.has(idx);
                    if (enBingo) carton.classList.add('tiene-asignacion-bingo');
                    else if (enFigura) carton.classList.add('tiene-asignacion-figura');
                });
            }
        }

        function cambiarCartonesYPaleta() {
            if (modoAsignacionActivo) return;
            detenerAuto();
            cartonesFueraDeJuego.clear();
            desactivarModoRevancha();

            try {
                const raw = localStorage.getItem('bingo_config');
                if (raw) {
                    const config = JSON.parse(raw);
                    if (Array.isArray(config.temasActivos) && config.temasActivos.length > 0) {
                        TEMAS_ACTIVOS = config.temasActivos;
                    }
                    const cc = config.cartonesCombinados || {};
                    CC_SECUENCIAS = Array.isArray(cc.secuencias) ? cc.secuencias.slice() : [];
                    CC_SECUENCIA_EN_USO = cc.secuenciaEnUsoId || (CC_SECUENCIAS[0] ? CC_SECUENCIAS[0].id : '');
                    if (config.modoTemas === 'combinado' || config.modoTemas === 'simple') {
                        MODO_TEMAS = config.modoTemas;
                    } else if (cc.activo === true) {
                        MODO_TEMAS = 'combinado';
                    } else {
                        MODO_TEMAS = 'simple';
                    }
                }
            } catch (e) {}

            if (MODO_TEMAS === 'combinado') {
                if (CC_SECUENCIAS.length > 1) {
                    const idxActual = CC_SECUENCIAS.findIndex(s => s.id === CC_SECUENCIA_EN_USO);
                    const idxNuevo = (idxActual + 1) % CC_SECUENCIAS.length;
                    CC_SECUENCIA_EN_USO = CC_SECUENCIAS[idxNuevo].id;
                }
            } else {
                const indicesActivos = PALETAS
                    .map((p, i) => TEMAS_ACTIVOS.includes(p.nombre) ? i : -1)
                    .filter(i => i !== -1);

                if (indicesActivos.length > 0) {
                    indiceRotacionActual = (indiceRotacionActual + 1) % indicesActivos.length;
                    paletaActual = indicesActivos[indiceRotacionActual];
                } else {
                    indiceRotacionActual = (indiceRotacionActual + 1) % PALETAS.length;
                    paletaActual = indiceRotacionActual;
                }
            }

            if (CANTIDAD_FIGURAS >= 1 && ORDEN_FIGURAS.length > 0) {
                if (ORDEN_FIGURAS.length === 1) {
                    figuraActual = ORDEN_FIGURAS[0];
                } else {
                    let nuevaFigura = figuraActual;
                    while (nuevaFigura === figuraActual) {
                        nuevaFigura = ORDEN_FIGURAS[Math.floor(Math.random() * ORDEN_FIGURAS.length)];
                    }
                    figuraActual = nuevaFigura;
                }
            }

            reiniciarJuego();
            aplicarTamanoControl();
            aplicarConfigFiguras();
            aplicarEspacioNotch();
            aplicarBloqueoScroll();
        }

        function salirAlMenu() {
            if (saliendoDelJuego) return;
            saliendoDelJuego = true;

            detenerAuto();

            const body = document.body;
            body.style.overflow = '';
            body.style.height = '';
            body.style.position = '';
            body.style.inset = '';
            body.style.overscrollBehavior = '';
            body.style.paddingTop = '';
            body.style.paddingBottom = '';
            document.documentElement.style.overflow = '';

            body.classList.remove(
                'modo-revancha',
                'modo-asignacion',
                'modo-mixto-jugando',
                'animaciones-pausadas',
                'modo-lite',
                'tema-verde', 'tema-azul', 'tema-rojo', 'tema-negro',
                'tema-naranja', 'tema-morado', 'tema-clasico',
                'tema-dorado', 'tema-madera', 'tema-kate', 'tema-cyberpunk',
                'tema-volcano', 'tema-pixel', 'tema-esmeralda', 'tema-candy',
                'tema-oro', 'tema-pacifico', 'tema-halloween', 'tema-sport',
                'tema-titan', 'tema-bronce'
            );

            hacerFadeOutMusica(1500, () => {
                window.location.replace('index.html?t=' + Date.now());
            });
        }

        window.sacarBola = sacarBola;
        window.sacarBolaEspecifica = sacarBolaEspecifica;
        window.reiniciarJuego = reiniciarJuego;
        window.cambiarCartonesYPaleta = cambiarCartonesYPaleta;
        window.confirmarRevancha = confirmarRevancha;
        window.guardarPartida = guardarPartida;

        document.addEventListener('DOMContentLoaded', () => {
            if (document.getElementById('cartonesGrid')) {
                inicializarAudios();
                cargarConfiguracion();
                aplicarEspacioNotch();
                aplicarBloqueoScroll();
                initVoces();

                const btnAtras = document.getElementById('btnAtrasJuego');
                if (btnAtras) btnAtras.addEventListener('click', salirAlMenu);

                iniciarMusicaFondo();

                const desbloquear = () => {
                    desbloquearVoz();
                    desbloquearSonidos();
                    document.removeEventListener('touchstart', desbloquear);
                    document.removeEventListener('click', desbloquear);
                };
                document.addEventListener('touchstart', desbloquear, { once: true });
                document.addEventListener('click', desbloquear, { once: true });

                const indicesActivos = PALETAS
                    .map((p, i) => TEMAS_ACTIVOS.includes(p.nombre) ? i : -1)
                    .filter(i => i !== -1);

                indiceRotacionActual = 0;
                paletaActual = indicesActivos.length > 0 ? indicesActivos[0] : 0;

                aplicarTemaEnBody();
                aplicarParametrosResaltado();

                if (USAR_BASE_DATOS) suscribirNombresFirebase();

                const modoCargarPartida = localStorage.getItem('bingo_modo_cargar');
                if (modoCargarPartida === '1') {
                    localStorage.removeItem('bingo_modo_cargar');
                }

                const modoRevanchaDesdeIndex = localStorage.getItem('bingo_modo_revancha');
                if (modoRevanchaDesdeIndex === '1') {
                    localStorage.removeItem('bingo_modo_revancha');
                }

                let partidaCargada = false;
                if (modoCargarPartida === '1') {
                    partidaCargada = cargarPartidaGuardada();
                }

                if (!partidaCargada) {
                    reiniciarJuego();
                }

                if (MODO_JUEGO === 'mixto' && !partidaCargada) {
                    setTimeout(() => activarModoAsignacion(), 600);
                } else if (modoRevanchaDesdeIndex === '1') {
                    setTimeout(() => activarModoRevancha(), 900);
                }

                const btnCambiar = document.querySelector('.btn-cambiar');
                if (btnCambiar) btnCambiar.onclick = cambiarCartonesYPaleta;

                document.addEventListener('visibilitychange', () => {
                    if (document.hidden && autoActivo) {
                        detenerAuto();
                    }
                });
            }
        });

        document.addEventListener('contextmenu', function(e) {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            const esMovil = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
            if (!esMovil) return;
            e.preventDefault();
        });
    </script>
</body>
